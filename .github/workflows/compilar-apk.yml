# Compila el APK en los servidores de GitHub (gratis) cada vez que subes cambios,
# o cuando lo pides con el botón "Run workflow" en la pestaña Actions.
# El APK queda en la sección "Releases" del repositorio, listo para descargar en el teléfono.
name: Compilar APK

on:
  push:
    branches: [ main, compilar-apk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ChrrysDump.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ChrrysDump.apk \
            --title "ChrrysDump (última versión)" \
            --notes "Compilado automáticamente desde ${{ github.sha }}. Descarga ChrrysDump.apk en tu teléfono e instálalo."

      - uses: actions/upload-artifact@v4
        with:
          name: ChrrysDump-apk
          path: ChrrysDump.apk
